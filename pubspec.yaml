name: otel_web_socket_channel
description: OpenTelemetry instrumentation for `package:web_socket_channel`.
  Wraps a `WebSocketChannel` to emit a connection-lifetime span,
  per-frame event spans (opt-in), and `messaging.*` semconv attributes.
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_web_socket_channel
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  stream_channel: ^2.1.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
